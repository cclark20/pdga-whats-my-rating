<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="See how your official PDGA rating is calculated and what your next rating is projected to be." />
    <title>What's My Rating?</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap"
    />
    <script>
      // set the theme before first paint: saved choice, else the OS preference, else dark
      try {
        var saved = localStorage.getItem("theme");
        var light = window.matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.dataset.theme = saved || (light ? "light" : "dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
